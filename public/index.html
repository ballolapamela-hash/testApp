<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Node.js File Server</title>
    </head>
    <body>
        <div class = "container">
            <h1>Welcome to the Node.js File Server</h1>
            <img src="inawall2.jpg" alt="test img">

            <h2>Upload files (Maximum 10MB)</h2>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <input type="file" name="file" required>
                <br><br>
                <button type="submit">Upload</button>
            </form>
            <p id="statusMessage" style="margin-top: 1rem; font-weight: bold;"></p>
    </div>
    <script>
        const uploadForm = document.getElementById('uploadForm');
        const statusMessage = document.getElementById('statusMessage');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            statusMessage.className = 'loading';
            statusMessage.textContent = 'Uploading...';

            const formData = new FormData(uploadForm);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    statusMessage.className = 'success';
                    statusMessage.textContent = data.message;
                    uploadForm.reset();
                } else {
                    statusMessage.className = 'error';
                    statusMessage.textContent = data.message;
                }
            } catch (err) {
                statusMessage.className = 'error';
                statusMessage.textContent = 'An error occurred during upload.';
            }
        });
    </script>
    </body>
</html>
